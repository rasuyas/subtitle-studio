name: Publish Nightly

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_VER="$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' VERSION)"
          if [ -z "$RAW_VER" ]; then
            echo "VERSION is empty." >&2
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short "$GITHUB_SHA")"

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly (v$RAW_VER @ $SHORT_SHA)" \
            --notes "Automated rolling Nightly build for commit $GITHUB_SHA." \
            --prerelease
