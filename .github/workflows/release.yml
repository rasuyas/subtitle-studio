name: Create release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release if version tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_VER="$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' VERSION)"
          if [ -z "$RAW_VER" ]; then
            echo "VERSION is empty." >&2
            exit 1
          fi
          TAG="v$RAW_VER"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping release creation."
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not check whether tag $TAG exists." >&2
              exit "$status"
            fi
            gh release create "$TAG" --title "v$RAW_VER" --generate-notes
          fi
